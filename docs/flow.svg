<svg xmlns="http://www.w3.org/2000/svg" width="960" height="628" viewBox="0 0 960 628" role="img" aria-label="SYMIONE SEAL sequence: an agent opens a run, the person seals the exact input on their phone, the Seal signs a receipt, the downstream system verifies and redeems it once, then acts.">
<rect x="0.5" y="0.5" width="959" height="627" rx="14" fill="#F7F5EF" stroke="#E7E2D8"/>
<line x1="120" y1="74" x2="120" y2="604" stroke="#E7E2D8" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="28" y="22" width="184" height="52" rx="9" fill="#FBFAF7" stroke="#E7E2D8"/>
<text x="120" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#1F1F1A">AGENT</text>
<text x="120" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">Claude, any MCP client</text>
<line x1="362" y1="74" x2="362" y2="604" stroke="#E7E2D8" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="270" y="22" width="184" height="52" rx="9" fill="#FBFAF7" stroke="#1F1F1A"/>
<text x="362" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#1F1F1A">SEAL</text>
<text x="362" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">Worker + D1, Ed25519 key</text>
<line x1="604" y1="74" x2="604" y2="604" stroke="#E7E2D8" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="512" y="22" width="184" height="52" rx="9" fill="#FBFAF7" stroke="#E7E2D8"/>
<text x="604" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#1F1F1A">PERSON</text>
<text x="604" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">on their phone</text>
<line x1="832" y1="74" x2="832" y2="604" stroke="#E7E2D8" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="740" y="22" width="184" height="52" rx="9" fill="#FBFAF7" stroke="#E7E2D8"/>
<text x="832" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#1F1F1A">DOWNSTREAM</text>
<text x="832" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">Stripe, mail, deploy</text>
<line x1="134" y1="126" x2="358" y2="126" stroke="#1F1F1A" stroke-width="1.4"/>
<path d="M350 121.5L358 126L350 130.5" fill="none" stroke="#1F1F1A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="120" cy="126" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="120" y="129.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">1</text>
<text x="241" y="118" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">open a run</text>
<text x="241" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">intent + the exact actions</text>
<line x1="376" y1="186" x2="600" y2="186" stroke="#1F1F1A" stroke-width="1.4"/>
<path d="M592 181.5L600 186L592 190.5" fill="none" stroke="#1F1F1A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="362" cy="186" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="362" y="189.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">2</text>
<text x="483" y="178" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">seal link</text>
<text x="483" y="203" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">only for irreversible kinds</text>
<line x1="590" y1="246" x2="366" y2="246" stroke="#365C4A" stroke-width="1.4"/>
<path d="M374 241.5L366 246L374 250.5" fill="none" stroke="#365C4A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="604" cy="246" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="604" y="249.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">3</text>
<text x="483" y="238" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">Seal</text>
<text x="483" y="263" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#365C4A">after reading the exact input</text>
<line x1="348" y1="306" x2="124" y2="306" stroke="#365C4A" stroke-width="1.4"/>
<path d="M132 301.5L124 306L132 310.5" fill="none" stroke="#365C4A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="362" cy="306" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="362" y="309.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">4</text>
<text x="241" y="298" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">signed receipt</text>
<text x="241" y="323" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#365C4A">Ed25519 · input hash · 15 min · once</text>
<line x1="134" y1="366" x2="828" y2="366" stroke="#1F1F1A" stroke-width="1.4"/>
<path d="M820 361.5L828 366L820 370.5" fill="none" stroke="#1F1F1A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="120" cy="366" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="120" y="369.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">5</text>
<text x="476" y="358" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">action + receipt</text>
<text x="476" y="383" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">e.g. create this PaymentIntent</text>
<line x1="818" y1="426" x2="366" y2="426" stroke="#1F1F1A" stroke-width="1.4"/>
<path d="M374 421.5L366 426L374 430.5" fill="none" stroke="#1F1F1A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="832" cy="426" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="832" y="429.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">6</text>
<text x="597" y="418" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">redeem once</text>
<text x="597" y="443" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">after checking signature, kind, hash, expiry offline</text>
<rect x="724" y="464" width="216" height="44" rx="8" fill="#FBFAF7" stroke="#365C4A"/>
<text x="832" y="483" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">act</text>
<text x="832" y="499" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#365C4A">Idempotency-Key = receipt id</text>
<circle cx="710" cy="486" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="710" y="489.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">7</text>
<line x1="134" y1="546" x2="358" y2="546" stroke="#1F1F1A" stroke-width="1.4"/>
<path d="M350 541.5L358 546L350 550.5" fill="none" stroke="#1F1F1A" stroke-width="1.4" stroke-linejoin="round"/>
<circle cx="120" cy="546" r="9" fill="#F7F5EF" stroke="#7D7A70"/><text x="120" y="549.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7D7A70">8</text>
<text x="241" y="538" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="15" fill="#1F1F1A">report + evidence</text>
<text x="241" y="563" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#7D7A70">every step on a hash-chained ledger</text>
</svg>
